name: Vevor-Build lilygo-rtl_433-fsk
# Eigener Build für den LilyGO (TTGO LoRa32 v2.1, SX1276 FSK, 868,3 MHz) mit dem
# Vevor-7in1-Fix aus benji2k2/rtl_433_ESP (Branch vevor-fix). Gleiche Werkzeuge
# wie task-build.yml (Python 3.14, pioarduino platformio-core v6.1.19, ci.sh).
run-name: "Vevor-Build ${{ github.ref_name }} ${{ github.sha }}"

on:
  workflow_dispatch:
  push:
    branches: [vevor-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build firmware
        env:
          PLATFORMIO_BUILD_FLAGS: ""   # ci_build_firmware.sh liest sie unter set -u, auch im prod-Modus mit --version
        run: ./scripts/ci.sh build lilygo-rtl_433-fsk --deploy-ready --mode prod --version "vevor-${GITHUB_SHA::7}"

      - name: Checksums
        run: |
          ls -la generated/artifacts/
          find generated/artifacts -type f -name '*.bin' -exec sha256sum {} \;

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lilygo-rtl_433-fsk-vevor
          path: generated/artifacts/
          retention-days: 30
